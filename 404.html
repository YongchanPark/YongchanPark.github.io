<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found - Yong-chan Park</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; }
    .not-found-card { width: min(620px, 100%); padding: 52px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
    .not-found-code { margin: 0 0 12px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; }
    .not-found h1 { margin: 0; font-family: var(--serif); font-size: clamp(42px, 8vw, 66px); line-height: 1.05; letter-spacing: -.045em; }
    .not-found p { max-width: 480px; margin: 18px 0 26px; color: var(--muted); }
    .not-found a { color: var(--accent); font-weight: 700; border-bottom: 1px solid #9aabb9; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-card">
      <p class="not-found-code">404</p>
      <h1>Page not found</h1>
      <p>The page may have moved or the address may be incorrect.</p>
      <a href="/">Return to the homepage</a>
    </div>
  </main>
</body>
</html>
